# Build the self-hosted RGC compiler for every supported platform.
#
# Bootstrap chain for a release `vX.Y.Z`:
#   1. the previous release's compiler (BOOTSTRAP_TAG) builds the self-hosted
#      compiler from the previous tag's source,
#   2. that compiler builds this release's source twice (rgc1, rgc2),
#   3. rgc1 and rgc2 must emit identical self-IR (fixed point),
#   4. smoke tests run, and each target archive (compiler + standard library)
#      is uploaded to the GitHub Release for `source_tag`.
#
# A release for `source_tag` must exist (draft is fine) before dispatch.
# `SHA256SUMS` is generated by the `checksums` job after every platform lands.

name: release

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Source tag to build (e.g. v0.0.2)
        required: true
        default: v0.0.2
      platforms:
        description: "Comma-separated platforms, or all"
        required: true
        default: all

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.source_tag }}-${{ inputs.platforms }}
  cancel-in-progress: false

env:
  BOOTSTRAP_TAG: v0.0.2
  BOOTSTRAP_VERSION: 0.0.2
  LLVM_VERSION: 23.1.4

jobs:
  prepare:
    name: prepare matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.matrix.outputs.version }}
    steps:
      - name: Build matrix
        id: matrix
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re

          tag = os.environ["SOURCE_TAG"].strip()
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)", tag)
          if not match:
              raise SystemExit("source_tag must look like vX.Y.Z: " + tag)
          version = match.group(1)

          all_platforms = [
              {"platform": "linux-x64", "target": "x86_64-unknown-linux-gnu", "os": "linux", "arch": "x64", "runner": "ubuntu-latest"},
              {"platform": "linux-arm64", "target": "aarch64-unknown-linux-gnu", "os": "linux", "arch": "arm64", "runner": "ubuntu-24.04-arm"},
              {"platform": "macos-x64", "target": "x86_64-apple-darwin", "os": "macos", "arch": "x64", "runner": "macos-15-intel"},
              {"platform": "macos-arm64", "target": "aarch64-apple-darwin", "os": "macos", "arch": "arm64", "runner": "macos-15"},
              {"platform": "windows-x64", "target": "x86_64-pc-windows-msvc", "os": "windows", "arch": "x64", "runner": "windows-latest"},
              {"platform": "windows-arm64", "target": "aarch64-pc-windows-msvc", "os": "windows", "arch": "arm64", "runner": "windows-11-arm"},
          ]

          raw = os.environ["PLATFORMS"].strip()
          if raw == "all":
              selected = all_platforms
          else:
              requested = [p.strip() for p in raw.split(",") if p.strip()]
              known = {p["platform"] for p in all_platforms}
              unknown = sorted(set(requested) - known)
              if unknown:
                  raise SystemExit("unknown platform(s): " + ", ".join(unknown))
              selected = [p for p in all_platforms if p["platform"] in requested]
          if not selected:
              raise SystemExit("no platforms selected")

          print("version=" + version)
          print("matrix=" + json.dumps({"include": selected}, separators=(",", ":")))
          PY

  dist:
    name: dist (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_tag }}

      - name: Checkout bootstrap source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BOOTSTRAP_TAG }}
          path: bootstrap-src

      - name: Download compiler from ${{ env.BOOTSTRAP_TAG }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXT: ${{ matrix.os == 'windows' && 'zip' || 'tar.gz' }}
        run: |
          set -euo pipefail
          mkdir -p toolchain
          asset="rgc-${BOOTSTRAP_VERSION}-${{ matrix.target }}.${EXT}"
          gh release download "$BOOTSTRAP_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" --dir toolchain --clobber
          echo "SEED_ARCHIVE=$asset" >> "$GITHUB_ENV"

      - name: Extract compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -Path "toolchain/$env:SEED_ARCHIVE" -DestinationPath toolchain -Force

      - name: Extract compiler (Unix)
        if: runner.os != 'Windows'
        run: tar -xzf "toolchain/$SEED_ARCHIVE" -C toolchain

      - name: Cache LLVM archive (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/rgc-llvm/archives
          key: llvm-${{ env.LLVM_VERSION }}-${{ matrix.platform }}-archive

      - name: Restore LLVM install (macOS x64)
        if: matrix.platform == 'macos-x64'
        id: macos-llvm-install
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/rgc-llvm/${{ env.LLVM_VERSION }}/macos-x64
          key: llvm-${{ env.LLVM_VERSION }}-${{ matrix.platform }}-install

      - name: Set up LLVM (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          eval "$(bash scripts/setup-llvm.sh)"
          echo "LLVM_BIN=$LLVM_BIN" >> "$GITHUB_ENV"
          echo "LLVM_DIR=$LLVM_DIR" >> "$GITHUB_ENV"

      - name: Save LLVM install (macOS x64)
        if: always() && matrix.platform == 'macos-x64' && steps.macos-llvm-install.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.cache/rgc-llvm/${{ env.LLVM_VERSION }}/macos-x64
          key: llvm-${{ env.LLVM_VERSION }}-${{ matrix.platform }}-install

      - name: Restore LLVM archive (Windows)
        if: runner.os == 'Windows'
        id: windows-llvm-archive
        uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/rgc-llvm/archives
          key: llvm-${{ env.LLVM_VERSION }}-${{ matrix.platform }}-windows-archive

      - name: Set up LLVM (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/setup-llvm.ps1

      - name: Save LLVM archive (Windows)
        if: always() && runner.os == 'Windows' && steps.windows-llvm-archive.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/AppData/Local/rgc-llvm/archives
          key: llvm-${{ env.LLVM_VERSION }}-${{ matrix.platform }}-windows-archive

      - name: Restore vcpkg zlib/zstd
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-zlib-zstd-${{ matrix.platform }}-static-llvm-${{ env.LLVM_VERSION }}

      - name: Install zlib/zstd (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $arch = if ("${{ matrix.platform }}" -eq "windows-arm64") { "arm64" } else { "x64" }
          $triplet = "$arch-windows-static"
          & "$vcpkg\vcpkg.exe" install "zlib:$triplet" "zstd:$triplet" --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CMAKE_PREFIX_PATH=$vcpkg\installed\$triplet" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_TRIPLET=$triplet" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Save vcpkg zlib/zstd
        if: always() && runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: C:\vcpkg\installed
          key: vcpkg-zlib-zstd-${{ matrix.platform }}-static-llvm-${{ env.LLVM_VERSION }}

      - name: Build self-hosted compiler (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          export PATH="$LLVM_BIN:$PATH"
          seed="$PWD/toolchain/rgc"
          ( cd src && bash tools/llvm-shim.sh )
          link_args="$(cat src/target/build/link-args)"
          if [ "$RUNNER_OS" = "macOS" ]; then
            # The LLVM archive ships its own libc++ dylibs next to the LLVM
            # archives; searching the SDK first keeps -lc++ on the system
            # runtime instead of the @rpath copy that fails to resolve.
            sdk_lib="$(xcrun --show-sdk-path)/usr/lib"
            link_args="-L$sdk_lib $link_args -stdlib=libc++ -lc++ -Wl,-rpath,/usr/lib"
          fi
          if [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            link_args="$link_args -fuse-ld=lld"
          fi
          echo "link_args: $link_args"
          # Build the previous release's self-hosted compiler from its source.
          ( cd bootstrap-src/src && "$seed" src/main.rg --link-args "$link_args" -o "$PWD/../../rgc-bootstrap" )
          # Build this release's source twice with the self-hosted compiler.
          "$PWD/rgc-bootstrap" src/src/main.rg --link-args "$link_args" -o "$PWD/rgc1"
          "$PWD/rgc1" src/src/main.rg --link-args "$link_args" -o "$PWD/rgc2"
          # Fixed point: both generations must emit identical self-IR.
          "$PWD/rgc1" src/src/main.rg --emit-llvm -o "$PWD/rgc1.ll"
          "$PWD/rgc2" src/src/main.rg --emit-llvm -o "$PWD/rgc2.ll"
          cmp -s "$PWD/rgc1.ll" "$PWD/rgc2.ll"
          # Smoke tests.
          "$PWD/rgc2" examples/hello.rg -o "$PWD/hello"
          "$PWD/hello" > /dev/null
          "$PWD/rgc2" examples/hello.rg --emit-exports "$PWD/exports.json"
          test -s "$PWD/exports.json"

      - name: Build self-hosted compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Get-Location).Path
          $arch = if ("${{ matrix.platform }}" -eq "windows-arm64") { "arm64" } else { "x64" }

          # MSVC environment (link.exe, LIB, INCLUDE).
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          if (-not $vs) { throw "Visual Studio not found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"
          cmd /c "`"$vcvars`" $arch >nul 2>&1 && set" | ForEach-Object {
            $i = $_.IndexOf("=")
            if ($i -gt 0) { Set-Item -Path ("env:" + $_.Substring(0, $i)) -Value $_.Substring($i + 1) }
          }
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw "cl.exe not found after vcvarsall $arch"
          }

          $llvmRoot = Split-Path (Split-Path (Split-Path $env:LLVM_DIR -Parent) -Parent) -Parent
          $llvmConfig = Join-Path $env:LLVM_BIN "llvm-config.exe"
          $libDir = (& $llvmConfig --libdir).Trim()
          $targetComponents = if ($arch -eq "arm64") { @("aarch64codegen", "aarch64asmparser") } else { @("x86codegen", "x86asmparser") }
          $components = @("core", "irreader", "passes", "target") + $targetComponents
          $libNames = & $llvmConfig --libs @components
          $systemLibs = & $llvmConfig --system-libs
          function Normalize-Libs($names) {
            $out = @()
            foreach ($raw in ($names -split '\s+')) {
              if (-not $raw) { continue }
              if ($raw -like "-L*") { continue }
              $name = $raw
              if ($name -like "-l*") { $name = $name.Substring(2) }
              if ($name -match '[\\/]') { $name = [IO.Path]::GetFileName($name) }
              if ($name -notlike "*.lib") { $name += ".lib" }
              if ($name -match '^(zstd|libzstd|zlib|zs|xml2|libxml2)') { continue }
              $out += $name
            }
            return $out
          }
          $libNames = Normalize-Libs $libNames
          $systemLibs = Normalize-Libs $systemLibs
          Write-Host "LLVM libs: $($libNames -join ' ')"
          Write-Host "LLVM system libs: $($systemLibs -join ' ')"

          $vcpkgLib = Join-Path $env:CMAKE_PREFIX_PATH "lib"
          $zlib = @("zs.lib", "zlib.lib", "zlibstatic.lib") |
            Where-Object { Test-Path (Join-Path $vcpkgLib $_) } | Select-Object -First 1
          $zstd = @("zstd.lib", "zstd_static.lib", "libzstd.lib") |
            Where-Object { Test-Path (Join-Path $vcpkgLib $_) } | Select-Object -First 1
          if (-not $zlib -or -not $zstd) {
            Get-ChildItem $vcpkgLib | Select-Object -ExpandProperty Name
            throw "zlib/zstd libraries not found in $vcpkgLib"
          }
          # LLVM's llvm-config emits build-machine paths for zlib/zstd (e.g.
          # S:\llvm\...\zstd_static.lib). Drop those entries and provide the
          # LLVM-expected names from the vcpkg static libraries instead.
          $toolLib = Join-Path $env:RUNNER_TEMP "rgc-tool-libs"
          New-Item -ItemType Directory -Force -Path $toolLib | Out-Null
          Copy-Item (Join-Path $vcpkgLib $zstd) (Join-Path $toolLib "zstd_static.lib")
          Copy-Item (Join-Path $vcpkgLib $zlib) (Join-Path $toolLib "zlib.lib")
          Copy-Item (Join-Path $vcpkgLib $zlib) (Join-Path $toolLib "zs.lib")
          $env:LIB = "$toolLib;$libDir;$vcpkgLib;$env:LIB"

          # The compiler calls `g++` to link; translate that call to cl.exe.
          # RGC objects carry no /DEFAULTLIB directives, so link.ps1 names the
          # static CRT explicitly or programs link without printf/mainCRTStartup.
          $shim = Join-Path $env:RUNNER_TEMP "llvm_shim.obj"
          & cl.exe /nologo /c /O2 /MT /std:c++17 /EHsc /D_CRT_SECURE_NO_WARNINGS /I "$llvmRoot\include" src\llvm_shim.cpp /Fo"$shim"
          if ($LASTEXITCODE -ne 0) { throw "failed to compile llvm_shim.cpp" }
          $linkArgs = (@($shim) + $libNames + $systemLibs + @("zstd_static.lib", "zlib.lib")) -join " "

          $wrapDir = Join-Path $env:RUNNER_TEMP "rgc-link"
          New-Item -ItemType Directory -Force -Path $wrapDir | Out-Null
          @'
          $obj = $null; $out = $null; $libs = @(); $linkFlags = @()
          for ($i = 0; $i -lt $args.Count; $i++) {
            $a = $args[$i]
            if ($a -eq "-g" -or $a -eq "-lm" -or $a -eq "-lpthread" -or $a -eq "-fPIC") { continue }
            if ($a -eq "-o") { $i++; $out = $args[$i]; continue }
            if ($a -eq "-lws2_32") { $libs += "ws2_32.lib"; continue }
            if ($a -eq "-lbcrypt") { $libs += "bcrypt.lib"; continue }
            if ($a -eq "-shared") { $linkFlags += "/DLL"; continue }
            if ($null -eq $obj -and -not $a.StartsWith("-")) { $obj = $a; continue }
            $libs += $a
          }
          # The bootstrap compiler comes from the previous release and predates the Windows
          # runtime shims, so its output still calls a few POSIX CRT names; alias them to the
          # MSVC spellings (harmless when unused) so the seed can build the new compiler.
          $linkFlags += @(
            "/ALTERNATENAME:write=_write",
            "/ALTERNATENAME:read=_read",
            "/ALTERNATENAME:close=_close",
            "/ALTERNATENAME:unlink=_unlink",
            "/ALTERNATENAME:access=_access",
            "/ALTERNATENAME:getcwd=_getcwd",
            "/ALTERNATENAME:__errno_location=_errno"
          )
          & cl.exe /nologo /MT $obj /link ("/OUT:" + $out) @linkFlags @libs `
            ws2_32.lib bcrypt.lib `
            libcmt.lib libucrt.lib libvcruntime.lib legacy_stdio_definitions.lib
          exit $LASTEXITCODE
          '@ | Set-Content -Path (Join-Path $wrapDir "link.ps1") -Encoding ascii
          "@echo off`r`npowershell -NoProfile -ExecutionPolicy Bypass -File `"%~dp0link.ps1`" %*`r`n" |
            Set-Content -Path (Join-Path $wrapDir "g++.cmd") -Encoding ascii
          $env:PATH = "$wrapDir;$env:PATH"

          $seed = Join-Path $root "toolchain\rgc.exe"
          Push-Location (Join-Path $root "bootstrap-src\src")
          & $seed src/main.rg --link-args $linkArgs -o "$root\rgc-bootstrap.exe"
          if ($LASTEXITCODE -ne 0) { throw "bootstrap compiler build failed" }
          Pop-Location
          & "$root\rgc-bootstrap.exe" src/src/main.rg --link-args $linkArgs -o "$root\rgc1.exe"
          if ($LASTEXITCODE -ne 0) { throw "rgc1 build failed" }
          & "$root\rgc1.exe" src/src/main.rg --link-args $linkArgs -o "$root\rgc2.exe"
          if ($LASTEXITCODE -ne 0) { throw "rgc2 build failed" }

          & "$root\rgc1.exe" examples\hello.rg --emit-llvm -o "$root\hello.ll"
          $rc = $LASTEXITCODE
          $size = if (Test-Path "$root\hello.ll") { (Get-Item "$root\hello.ll").Length } else { 0 }
          Write-Host "hello IR: exit=$rc bytes=$size"
          if ($rc -ne 0 -or $size -le 0) { throw "hello IR generation failed (exit=$rc)" }

          foreach ($gen in @("rgc1", "rgc2")) {
            $exe = "$root\$gen.exe"
            $ll = "$root\$gen.ll"
            $irLog = "$root\$gen-ir.log"
            & $exe src/src/main.rg --emit-llvm -o $ll *> $irLog
            $rc = $LASTEXITCODE
            $size = if (Test-Path $ll) { (Get-Item $ll).Length } else { 0 }
            Write-Host "$gen IR: exit=$rc bytes=$size"
            if ($rc -ne 0 -or $size -le 0) {
              if (Test-Path $irLog) { Get-Content $irLog -Tail 40 | ForEach-Object { Write-Host $_ } }
              throw "$gen IR generation failed (exit=$rc)"
            }
          }
          if ((Get-FileHash "$root\rgc1.ll").Hash -ne (Get-FileHash "$root\rgc2.ll").Hash) {
            throw "rgc1/rgc2 IR mismatch"
          }

          & "$root\rgc2.exe" examples\hello.rg -o "$root\hello.exe"
          if ($LASTEXITCODE -ne 0) { throw "hello compile failed" }
          & "$root\hello.exe" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "hello run failed" }
          & "$root\rgc2.exe" examples\hello.rg --emit-exports "$root\exports.json"
          if ($LASTEXITCODE -ne 0) { throw "emit-exports failed" }
          if (-not (Test-Path "$root\exports.json")) { throw "exports.json not written" }

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p staging
          cp rgc2 staging/rgc
          cp -R lib staging/lib
          mkdir -p dist
          tar -czf "dist/rgc-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.tar.gz" -C staging rgc lib

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item rgc2.exe staging/rgc.exe
          Copy-Item lib staging/lib -Recurse
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path staging/rgc.exe, staging/lib `
            -DestinationPath "dist/rgc-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.zip" -Force

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          ls -lh dist
          gh release upload "$SOURCE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  checksums:
    name: checksums
    needs: [prepare, dist]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "rgc-${VERSION}-*" --dir dist --clobber

      - name: Generate and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum rgc-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$SOURCE_TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
